<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Controlled 3D Particles — a lab experiment by Rapar Rubel</title>
<meta name="description" content="Control a 3D particle universe with your hand through your webcam: raise 1–5 fingers to change shape, pinch to expand, move to rotate. Built by Rapar Rubel.">
<meta name="author" content="Rapar Rubel (Rubel Miah)">
<link rel="canonical" href="https://rubelpublic.github.io/lab/hand-particles/">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
<meta property="og:title" content="Hand-Controlled 3D Particles — Rapar Rubel">
<meta property="og:description" content="Move a universe of 12,000 particles with your hand, right in the browser.">
<meta property="og:image" content="https://rubelpublic.github.io/assets/og-image.jpg">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Hand-Controlled 3D Particles","url":"https://rubelpublic.github.io/lab/hand-particles/","applicationCategory":"MultimediaApplication","operatingSystem":"Web browser","description":"A browser experiment where 12,000 3D particles follow your hand through the webcam: raise 1 to 5 fingers to switch between sphere, heart, flower, Saturn and firework, pinch to expand, move your hand to rotate. Hand tracking runs locally with MediaPipe.","creator":{"@id":"https://rubelpublic.github.io/#person","@type":"Person","name":"Rapar Rubel"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05080a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #ede6d8; }
  canvas { display: block; }
  #video-container { position: absolute; bottom: 14px; right: 14px; width: 168px; height: 126px; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; overflow: hidden; z-index: 10; background: #000; display: none; }
  .input_video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #ui { position: absolute; top: 14px; left: 14px; pointer-events: none; z-index: 10; background: rgba(5,8,10,.62); backdrop-filter: blur(6px); padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.55; border: 1px solid rgba(255,255,255,.1); max-width: 260px; }
  #ui h2 { margin: 0 0 4px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #f0a830; font-weight: 600; }
  #ui p { margin: 0; }
  #ui b { color: #fff; }
  #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; text-align: center; font-size: 15px; background: rgba(5,8,10,.7); padding: 14px 18px; border-radius: 12px; max-width: 80%; }
  #status.hide { display: none; }
  #exit { position: absolute; top: 14px; right: 14px; z-index: 11; background: rgba(5,8,10,.62); color: #ede6d8; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; display: none; }
  @media (max-width: 520px) { #ui { font-size: 12px; max-width: 200px; } #video-container { width: 112px; height: 84px; } }
</style>
</head>
<body>
<div id="status">Starting camera &amp; hand-tracking model…<br><small style="opacity:.7">Please allow webcam access. Video never leaves your device.</small></div>

<div id="ui">
  <h2 id="mode">Hand controls</h2>
  <p>✋ <b>Shape:</b> <span id="shape-name">Sphere</span> <span id="shape-hint">(raise 1–5 fingers)</span></p>
  <p>🤏 <b>Expansion:</b> <span id="expansion-val">1.0</span>x <span id="pinch-hint">(pinch thumb &amp; index)</span></p>
  <p>👋 <b>Rotate:</b> <span id="rotate-hint">move your hand</span></p>
</div>

<button id="exit" type="button">✕ Stop camera</button>
<div id="video-container"><video class="input_video" autoplay playsinline muted></video></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Hand-Controlled 3D Particles — by Rapar Rubel (Rubel Miah).
// Hand tracking runs in the browser with MediaPipe Hands; no video is uploaded anywhere.
const W = () => window.innerWidth, H = () => window.innerHeight;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.001);
const camera = new THREE.PerspectiveCamera(75, W() / H(), 0.1, 1000);
camera.position.z = 120;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W(), H());
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const small = Math.min(W(), H()) < 600;
const particleCount = small ? 7000 : 12000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const targetPositions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);

const tc = document.createElement('canvas'); tc.width = tc.height = 32;
const ctx = tc.getContext('2d'); const gr = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = gr; ctx.fillRect(0, 0, 32, 32);
const material = new THREE.PointsMaterial({ size: 2.0, vertexColors: true, map: new THREE.CanvasTexture(tc), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });

const shapes = [
  { name: 'Sphere', color: new THREE.Color(0x00d2ff), generate: i => { const phi = Math.acos(-1 + (2 * i) / particleCount), th = Math.sqrt(particleCount * Math.PI) * phi;
      return { x: 40 * Math.cos(th) * Math.sin(phi), y: 40 * Math.sin(th) * Math.sin(phi), z: 40 * Math.cos(phi) }; } },
  { name: 'Heart', color: new THREE.Color(0xff2a5f), generate: i => { const t = (i / particleCount) * Math.PI * 2;
      return { x: 3 * (16 * Math.pow(Math.sin(t), 3)), y: 3 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)), z: (Math.random() - 0.5) * 10 }; } },
  { name: 'Flower', color: new THREE.Color(0xffb703), generate: () => { const th = Math.random() * Math.PI * 2, phi = Math.random() * Math.PI, r = 30 + 15 * Math.sin(6 * th) * Math.sin(6 * phi);
      return { x: r * Math.cos(th) * Math.sin(phi), y: r * Math.sin(th) * Math.sin(phi), z: r * Math.cos(phi) }; } },
  { name: 'Saturn', color: new THREE.Color(0x8ecae6), generate: i => { if (i < particleCount * 0.4) { const n = particleCount * 0.4, phi = Math.acos(-1 + (2 * i) / n), th = Math.sqrt(n * Math.PI) * phi;
      return { x: 20 * Math.cos(th) * Math.sin(phi), y: 20 * Math.sin(th) * Math.sin(phi), z: 20 * Math.cos(phi) }; }
      const a = Math.random() * Math.PI * 2, r = 35 + Math.random() * 25; return { x: r * Math.cos(a), y: (Math.random() - 0.5) * 2, z: r * Math.sin(a) }; } },
  { name: 'Firework', color: new THREE.Color(0x9d4edd), generate: () => { const th = Math.random() * Math.PI * 2, phi = Math.acos(Math.random() * 2 - 1), s = Math.random() * 60;
      return { x: s * Math.sin(phi) * Math.cos(th), y: s * Math.sin(phi) * Math.sin(th), z: s * Math.cos(phi) }; } },
];

let currentShapeIndex = -1, targetExpansion = 1, currentExpansion = 1, targetRotationX = 0, targetRotationY = 0;
const $ = id => document.getElementById(id);
function updateShape(index) {
  if (index === currentShapeIndex) return;
  currentShapeIndex = index; const shape = shapes[index]; $('shape-name').innerText = shape.name;
  for (let i = 0; i < particleCount; i++) { const p = shape.generate(i);
    targetPositions[i * 3] = p.x; targetPositions[i * 3 + 1] = p.y; targetPositions[i * 3 + 2] = p.z;
    colors[i * 3] = shape.color.r; colors[i * 3 + 1] = shape.color.g; colors[i * 3 + 2] = shape.color.b; }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}
for (let i = 0; i < particleCount * 3; i++) positions[i] = (Math.random() - 0.5) * 200;
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particles = new THREE.Points(geometry, material); scene.add(particles);
updateShape(0);

let handSeen = false;
(function animate() {
  requestAnimationFrame(animate);
  currentExpansion += (targetExpansion - currentExpansion) * 0.1;
  if (!handSeen) targetRotationY += 0.002; // gentle idle spin until a hand appears
  particles.rotation.x += (targetRotationX - particles.rotation.x) * 0.05;
  particles.rotation.y += (targetRotationY - particles.rotation.y) * 0.05;
  const cp = geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) { const i3 = i * 3;
    cp[i3] += (targetPositions[i3] * currentExpansion - cp[i3]) * 0.05;
    cp[i3 + 1] += (targetPositions[i3 + 1] * currentExpansion - cp[i3 + 1]) * 0.05;
    cp[i3 + 2] += (targetPositions[i3 + 2] * currentExpansion - cp[i3 + 2]) * 0.05; }
  geometry.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
})();

// ---------- hand tracking ----------
const videoElement = document.querySelector('.input_video');
function onResults(results) {
  $('status').classList.add('hide'); $('video-container').style.display = 'block'; $('exit').style.display = 'block';
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    handSeen = true; const lm = results.multiHandLandmarks[0];
    const pinch = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
    targetExpansion = Math.max(0.2, Math.min(3.5, pinch * 10)); $('expansion-val').innerText = targetExpansion.toFixed(1);
    targetRotationY = (lm[9].x - 0.5) * Math.PI * 2; targetRotationX = (lm[9].y - 0.5) * Math.PI * 2;
    let up = 0;
    if (lm[8].y < lm[6].y) up++; if (lm[12].y < lm[10].y) up++; if (lm[16].y < lm[14].y) up++; if (lm[20].y < lm[18].y) up++;
    // thumb: compare tip to joint along the hand's own left/right axis, so it works for either hand
    const side = lm[17].x - lm[5].x; if ((lm[4].x - lm[3].x) * side < 0) up++;
    if (up > 0) updateShape(Math.max(0, Math.min(4, up - 1)));
  } else {
    handSeen = false; targetExpansion = 1.0; targetRotationX *= 0.95; targetRotationY *= 0.95;
  }
}

let cam = null, stream = null;
function mouseMode(reason) {
  $('status').innerHTML = reason + '<br><small style="opacity:.75">Mouse mode: move to rotate · scroll to expand · click or press 1–5 to change shape</small>';
  $('status').classList.remove('hide'); setTimeout(() => $('status').classList.add('hide'), 4200);
  $('mode').innerText = 'Mouse controls'; $('shape-hint').innerText = '(click or keys 1–5)'; $('pinch-hint').innerText = '(scroll)'; $('rotate-hint').innerText = 'move the mouse';
  addEventListener('pointermove', e => { targetRotationY = (e.clientX / W() - 0.5) * Math.PI * 2; targetRotationX = (e.clientY / H() - 0.5) * Math.PI; handSeen = true; });
  addEventListener('wheel', e => { targetExpansion = Math.max(0.2, Math.min(3.5, targetExpansion - e.deltaY * 0.002)); $('expansion-val').innerText = targetExpansion.toFixed(1); }, { passive: true });
  addEventListener('click', () => updateShape((currentShapeIndex + 1) % shapes.length));
  addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= 5) updateShape(n - 1); });
}

try {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof Hands === 'undefined') throw new Error('unsupported');
  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
  hands.setOptions({ maxNumHands: 1, modelComplexity: small ? 0 : 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
  hands.onResults(onResults);
  cam = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 });
  cam.start().then(() => { stream = videoElement.srcObject; }).catch(() => mouseMode('Camera not available or permission denied.'));
} catch (e) { mouseMode('This browser can’t run the hand tracker.'); }

$('exit').addEventListener('click', e => { e.stopPropagation();
  try { cam && cam.stop(); } catch (_) {}
  (videoElement.srcObject || stream) && (videoElement.srcObject || stream).getTracks().forEach(t => t.stop());
  $('video-container').style.display = 'none'; $('exit').style.display = 'none';
  try { parent !== window && parent.postMessage('hand-lab:close', location.origin); } catch (_) {}
  mouseMode('Camera stopped.'); });

addEventListener('resize', () => { camera.aspect = W() / H(); camera.updateProjectionMatrix(); renderer.setSize(W(), H()); });
</script>
</body>
</html>
